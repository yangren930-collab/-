'use strict';

// ═══════════════════════════════════════════════════════════════
// PHYSICS
// ═══════════════════════════════════════════════════════════════
const Physics = {
  GRAVITY:         0.55,
  MAX_FALL_SPEED:  18.0,
  FRICTION_GROUND: 0.82,
  FRICTION_AIR:    0.96,
  HITSTUN_DECAY:   0.95,
  SHIELD_DECAY:    1.2,
  SHIELD_MAX_HP:   100.0,
  SHIELD_REGEN:    0.3,

  calcKnockback(damageDelt, targetPercentage, knockbackPower, angleDeg) {
    const magnitude = (damageDelt * 0.1 + 2) * (1 + targetPercentage / 100) * knockbackPower;
    const rad = angleDeg * Math.PI / 180;
    return { vx: magnitude * Math.cos(rad), vy: -magnitude * Math.sin(rad) };
  },

  applyGravity(fighter) {
    if (!fighter.grounded) {
      fighter.vy += Physics.GRAVITY;
      if (fighter.vy > fighter.charDef.fallSpeed) fighter.vy = fighter.charDef.fallSpeed;
    }
  },

  applyFriction(fighter, hasHorizontalInput) {
    if (fighter.grounded && !hasHorizontalInput) {
      fighter.vx *= Physics.FRICTION_GROUND;
      if (Math.abs(fighter.vx) < 0.5) fighter.vx = 0;
    } else if (!fighter.grounded) {
      fighter.vx *= Physics.FRICTION_AIR;
    }
  },

  rectOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  },

  platformCollision(fighter, platforms) {
    let landed = false, landedPlatform = null;
    const currBottom = fighter.y + fighter.h;
    const prevBottom = currBottom - fighter.vy;
    const currLeft   = fighter.x, currRight = fighter.x + fighter.w;
    const currTop    = fighter.y, prevTop   = currTop - fighter.vy;

    for (const plat of platforms) {
      const { x: px, y: py, w: pw, h: ph } = plat;
      if (!(currRight > px && currLeft < px + pw)) continue;

      if (plat.solid) {
        if (prevBottom <= py + 1 && currBottom >= py && fighter.vy >= 0) {
          fighter.y = py - fighter.h; fighter.vy = 0; landed = true; landedPlatform = plat;
        }
        if (prevTop >= py + ph - 1 && currTop < py + ph && fighter.vy < 0) {
          fighter.y = py + ph; fighter.vy = 0;
        }
        const prevRight = currRight - fighter.vx;
        if (prevRight <= px + 1 && currRight > px) {
          if (currBottom > py && currTop < py + ph) { fighter.x = px - fighter.w; fighter.vx = 0; }
        }
        const prevLeft = currLeft - fighter.vx;
        if (prevLeft >= px + pw - 1 && currLeft < px + pw) {
          if (currBottom > py && currTop < py + ph) { fighter.x = px + pw; fighter.vx = 0; }
        }
      } else {
        if (fighter.vy >= 0 && prevBottom <= py + 1 && currBottom >= py && !fighter.droppingThrough) {
          fighter.y = py - fighter.h; fighter.vy = 0; landed = true; landedPlatform = plat;
        }
      }
    }
    return { landed, platform: landedPlatform };
  },

  blastZoneCheck(fighter, bz) {
    return fighter.x + fighter.w < bz.left || fighter.x > bz.right ||
           fighter.y + fighter.h < bz.top  || fighter.y > bz.bottom;
  },
};

// CHARACTERS & FIGHTER
// ═══════════════════════════════════════════════════════════════
function makeAttacks(dm, km, sm) {
  const d = v => Math.round(v * dm);
  const k = v => +(v * km).toFixed(2);
  const s = v => Math.max(2, Math.round(v / sm));
  return {
    jab:           { startup:s(3),  active:4,  recovery:7,  damage:d(3),  knockback:{power:k(0.5), angle:25},  hitbox:{xOff:48,yOff:12,w:28,h:24}, airOk:false, chargeMin:0,  chargeMax:0,  effectColor:'#ff9999' },
    tiltSide:      { startup:s(7),  active:5,  recovery:12, damage:d(8),  knockback:{power:k(0.7), angle:20},  hitbox:{xOff:52,yOff:8, w:40,h:32}, airOk:false, chargeMin:0,  chargeMax:0,  effectColor:'#ff6b6b' },
    tiltUp:        { startup:s(8),  active:5,  recovery:14, damage:d(7),  knockback:{power:k(0.65),angle:85},  hitbox:{xOff:10,yOff:-36,w:36,h:36},airOk:false, chargeMin:0,  chargeMax:0,  effectColor:'#ff8888' },
    tiltDown:      { startup:s(9),  active:4,  recovery:16, damage:d(6),  knockback:{power:k(0.6), angle:275}, hitbox:{xOff:30,yOff:52,w:44,h:20}, airOk:false, chargeMin:0,  chargeMax:0,  effectColor:'#cc3333' },
    smashSide:     { startup:s(16), active:4,  recovery:24, damage:d(18), knockback:{power:k(1.4), angle:15},  hitbox:{xOff:54,yOff:6, w:52,h:36}, airOk:false, chargeMin:20, chargeMax:60, effectColor:'#ffcc00' },
    smashUp:       { startup:s(14), active:5,  recovery:22, damage:d(16), knockback:{power:k(1.3), angle:80},  hitbox:{xOff:4, yOff:-48,w:44,h:52},airOk:false, chargeMin:20, chargeMax:60, effectColor:'#ffcc00' },
    smashDown:     { startup:s(18), active:4,  recovery:28, damage:d(14), knockback:{power:k(1.2), angle:265}, hitbox:{xOff:0, yOff:36,w:52,h:36}, airOk:false, chargeMin:20, chargeMax:60, effectColor:'#ffcc00' },
    aerialNeutral: { startup:s(5),  active:6,  recovery:10, damage:d(6),  knockback:{power:k(0.6), angle:50},  hitbox:{xOff:-20,yOff:-20,w:90,h:90},airOk:true,  chargeMin:0,  chargeMax:0,  effectColor:'#ffaaaa' },
    aerialForward: { startup:s(8),  active:5,  recovery:16, damage:d(10), knockback:{power:k(0.85),angle:30},  hitbox:{xOff:48,yOff:0, w:44,h:40}, airOk:true,  chargeMin:0,  chargeMax:0,  effectColor:'#ff6b6b' },
    aerialBack:    { startup:s(7),  active:6,  recovery:14, damage:d(12), knockback:{power:k(0.9), angle:165}, hitbox:{xOff:-60,yOff:0,w:44,h:40}, airOk:true,  chargeMin:0,  chargeMax:0,  effectColor:'#ff4444' },
    aerialUp:      { startup:s(6),  active:8,  recovery:12, damage:d(8),  knockback:{power:k(0.75),angle:90},  hitbox:{xOff:0, yOff:-52,w:52,h:44},airOk:true,  chargeMin:0,  chargeMax:0,  effectColor:'#ffbbbb' },
    aerialDown:    { startup:s(12), active:4,  recovery:20, damage:d(14), knockback:{power:k(1.1), angle:275}, hitbox:{xOff:4, yOff:56,w:44,h:36}, airOk:true,  chargeMin:0,  chargeMax:0,  effectColor:'#cc0000' },
    specialNeutral:{ startup:s(10), active:20, recovery:15, damage:d(5),  knockback:{power:k(0.5), angle:20},  hitbox:{xOff:56,yOff:16,w:24,h:24}, airOk:true,  chargeMin:0,  chargeMax:0,  effectColor:'#ffff55' },
    specialSide:   { startup:s(6),  active:30, recovery:18, damage:d(8),  knockback:{power:k(0.8), angle:10},  hitbox:{xOff:52,yOff:12,w:32,h:28}, airOk:true,  chargeMin:0,  chargeMax:0,  effectColor:'#ff8800' },
    specialUp:     { startup:s(4),  active:12, recovery:20, damage:d(4),  knockback:{power:k(0.4), angle:75},  hitbox:{xOff:4, yOff:-60,w:44,h:64},airOk:true,  chargeMin:0,  chargeMax:0,  effectColor:'#ffcc88' },
    specialDown:   { startup:s(14), active:6,  recovery:22, damage:d(12), knockback:{power:k(1.0), angle:90},  hitbox:{xOff:0, yOff:0, w:52,h:64}, airOk:true,  chargeMin:0,  chargeMax:0,  effectColor:'#cc6600' },
  };
}

const CHARACTERS = {
  BRAWLER: { name:'ブロウラー', colorBody:'#e63946', colorDetail:'#c1121f', colorHead:'#e63946', weight:110, walkSpeed:4.0, runSpeed:7.5, airSpeed:5.5, jumpPower:-14.0, shortHopPower:-8.5, doubleJumpPower:-12.0, fallSpeed:16.0, bodyW:48, bodyH:60, attacks:makeAttacks(1.0,1.0,1.0) },
  SWIFT:   { name:'スウィフト', colorBody:'#2196f3', colorDetail:'#0d47a1', colorHead:'#42a5f5', weight:80,  walkSpeed:5.5, runSpeed:10.0,airSpeed:7.0, jumpPower:-15.5,shortHopPower:-9.5, doubleJumpPower:-14.0,fallSpeed:14.0, bodyW:40, bodyH:52, attacks:makeAttacks(0.7,0.75,1.35) },
  HEAVY:   { name:'ヘビー',    colorBody:'#4caf50', colorDetail:'#1b5e20', colorHead:'#66bb6a', weight:140, walkSpeed:2.5, runSpeed:4.5, airSpeed:3.5, jumpPower:-11.0,shortHopPower:-7.0, doubleJumpPower:-10.0,fallSpeed:20.0, bodyW:60, bodyH:72, attacks:makeAttacks(1.4,1.35,0.7) },
};
const CHAR_KEYS = Object.keys(CHARACTERS);

const STATE = { IDLE:'IDLE', WALK:'WALK', RUN:'RUN', JUMP:'JUMP', DOUBLE_JUMP:'DOUBLE_JUMP', FALL:'FALL', ATTACK:'ATTACK', HITSTUN:'HITSTUN', SHIELD:'SHIELD', DODGE:'DODGE', DEAD:'DEAD', RESPAWN:'RESPAWN' };

class Fighter {
  constructor(charId, playerIndex, x, y) {
    this.charId = charId; this.playerIndex = playerIndex;
    this.charDef = CHARACTERS[charId];
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.facingRight = playerIndex === 0;
    this.state = STATE.IDLE; this.grounded = false;
    this.percentage = 0; this.stocks = 3; this.shieldHP = Physics.SHIELD_MAX_HP;
    this.currentAttackId = null; this.attackFrame = 0;
    this.chargeFrames = 0; this.chargingSmash = false; this.hitEntities = new Set();
    this.hasDoubleJump = true; this.droppingThrough = false; this.dropTimer = 0;
    this.hitstunFrames = 0; this.dodgeFrames = 0; this.invincible = false;
    this.jumpPressedFrame = -999; this.deathTimer = 0; this.respawnTimer = 0;
    this.pendingEffects = []; this.hitStop = 0; this.frameCount = 0;
  }
  get w() { return this.charDef.bodyW; }
  get h() { return this.charDef.bodyH; }

  update(input, opponent, stage) {
    this.frameCount++;
    if (this.hitStop > 0) { this.hitStop--; this._tickEffects(); return; }
    if (this.dropTimer > 0) { this.dropTimer--; if (this.dropTimer <= 0) this.droppingThrough = false; }
    switch (this.state) {
      case STATE.IDLE:        this._handleIdle(input); break;
      case STATE.WALK:        this._handleWalk(input); break;
      case STATE.RUN:         this._handleRun(input);  break;
      case STATE.JUMP: case STATE.DOUBLE_JUMP: case STATE.FALL: this._handleAir(input); break;
      case STATE.ATTACK:      this._handleAttack(input); break;
      case STATE.HITSTUN:     this._handleHitstun(); break;
      case STATE.SHIELD:      this._handleShield(input); break;
      case STATE.DODGE:       this._handleDodge(); break;
      case STATE.DEAD:        this._handleDead(); break;
      case STATE.RESPAWN:     this._handleRespawn(); break;
    }
    this._tickEffects();
  }

  _handleIdle(input) {
    if (input.shieldJustPressed) { this._transitionTo(STATE.SHIELD); return; }
    if (input.jumpJustPressed)   { this._startJump(); return; }
    if (this._tryAttack(input))  return;
    if (input.left || input.right) this._transitionTo(STATE.WALK);
    if (input.down && this.grounded) this._tryDropThrough();
  }
  _handleWalk(input) {
    if (input.shieldJustPressed) { this._transitionTo(STATE.SHIELD); return; }
    if (input.jumpJustPressed)   { this._startJump(); return; }
    if (this._tryAttack(input))  return;
    const cd = this.charDef;
    if (input.right) { this.vx = Math.min(this.vx+1.5, cd.walkSpeed); this.facingRight=true; if(this.vx>=cd.runSpeed*0.85) this._transitionTo(STATE.RUN); }
    else if (input.left) { this.vx = Math.max(this.vx-1.5,-cd.walkSpeed); this.facingRight=false; if(this.vx<=-cd.runSpeed*0.85) this._transitionTo(STATE.RUN); }
    else this._transitionTo(STATE.IDLE);
    if (input.down && this.grounded) this._tryDropThrough();
  }
  _handleRun(input) {
    if (input.shieldJustPressed) { this._transitionTo(STATE.SHIELD); return; }
    if (input.jumpJustPressed)   { this._startJump(); return; }
    if (this._tryAttack(input))  return;
    const cd = this.charDef;
    if (input.right) { this.vx=Math.min(this.vx+2,cd.runSpeed); this.facingRight=true; }
    else if (input.left) { this.vx=Math.max(this.vx-2,-cd.runSpeed); this.facingRight=false; }
    else this._transitionTo(STATE.IDLE);
    if (input.down && this.grounded) this._tryDropThrough();
  }
  _handleAir(input) {
    if (input.jumpJustPressed && this.hasDoubleJump && this.state!==STATE.DOUBLE_JUMP) { this._startDoubleJump(); return; }
    if (input.shieldJustPressed) { this._startDodge(input.left?'left':input.right?'right':'none'); return; }
    if (this._tryAttack(input)) return;
    const cd = this.charDef;
    if (input.right) { this.vx=Math.min(this.vx+1.2,cd.airSpeed); this.facingRight=true; }
    else if (input.left) { this.vx=Math.max(this.vx-1.2,-cd.airSpeed); this.facingRight=false; }
    if (this.vy > 0) this._transitionTo(STATE.FALL);
  }
  _handleAttack(input) {
    const attack = this.charDef.attacks[this.currentAttackId];
    if (this.chargingSmash && input.smashHeld) { this.chargeFrames++; if(this.chargeFrames>=attack.chargeMax) this.chargingSmash=false; return; }
    this.chargingSmash = false;
    this.attackFrame++;
    if (this.attackFrame >= attack.startup+attack.active+attack.recovery) { this.hitEntities.clear(); this._transitionTo(this.grounded?STATE.IDLE:STATE.FALL); }
  }
  _handleHitstun() { this.hitstunFrames--; this.vx*=Physics.HITSTUN_DECAY; if(this.hitstunFrames<=0) this._transitionTo(this.grounded?STATE.IDLE:STATE.FALL); }
  _handleShield(input) {
    if (!input.shield) { this.shieldHP=Math.min(Physics.SHIELD_MAX_HP,this.shieldHP+Physics.SHIELD_REGEN); this._transitionTo(STATE.IDLE); return; }
    this.shieldHP -= Physics.SHIELD_DECAY;
    if (input.left||input.right) { this._startDodge(input.left?'left':'right'); return; }
    if (this.shieldHP<=0) { this.shieldHP=0; this.hitstunFrames=120; this._transitionTo(STATE.HITSTUN); }
  }
  _handleDodge() { this.dodgeFrames--; if(this.dodgeFrames<=6) this.invincible=false; this.vx*=0.78; if(this.dodgeFrames<=0) this._transitionTo(this.grounded?STATE.IDLE:STATE.FALL); }
  _handleDead() { this.deathTimer--; }
  _handleRespawn() { this.respawnTimer--; if(this.respawnTimer<=0){this.invincible=false;this._transitionTo(STATE.IDLE);} }

  _transitionTo(s) { this.state=s; }
  _startJump() { this.jumpPressedFrame=this.frameCount; this.vy=this.charDef.jumpPower; this.grounded=false; this._transitionTo(STATE.JUMP); }
  _startDoubleJump() { this.hasDoubleJump=false; this.vy=this.charDef.doubleJumpPower; this._transitionTo(STATE.DOUBLE_JUMP); }
  _startDodge(dir) { this.dodgeFrames=24; this.invincible=true; if(dir==='right') this.vx=9; else if(dir==='left') this.vx=-9; else this.vx*=0.3; this._transitionTo(STATE.DODGE); }
  _tryDropThrough() { this.droppingThrough=true; this.dropTimer=12; this.vy=2; }

  _tryAttack(input) {
    if (!input.attackJustPressed && !input.specialJustPressed) return false;
    const air = !this.grounded;
    let id = null;
    if (input.specialJustPressed) {
      if (input.up) id='specialUp'; else if(input.down) id='specialDown'; else if(input.left||input.right) id='specialSide'; else id='specialNeutral';
    } else {
      if (input.smashRight||input.smashLeft) id='smashSide';
      else if (input.smashUp) id='smashUp';
      else if (input.smashDown) id='smashDown';
      else if (air) {
        if (input.up) id='aerialUp'; else if(input.down) id='aerialDown';
        else if((input.right&&!this.facingRight)||(input.left&&this.facingRight)) id='aerialBack';
        else if(input.left||input.right) id='aerialForward'; else id='aerialNeutral';
      } else {
        if (input.up) id='tiltUp'; else if(input.down) id='tiltDown'; else if(input.left||input.right) id='tiltSide'; else id='jab';
      }
    }
    if (!id) return false;
    const attack = this.charDef.attacks[id];
    if (air && !attack.airOk) return false;
    this.currentAttackId=id; this.attackFrame=0; this.chargeFrames=0;
    this.chargingSmash = attack.chargeMin>0;
    if(id==='smashSide'){if(input.smashLeft)this.facingRight=false;if(input.smashRight)this.facingRight=true;}
    this.hitEntities.clear();
    this._transitionTo(STATE.ATTACK);
    return true;
  }
  _tickEffects() { for(let i=this.pendingEffects.length-1;i>=0;i--){this.pendingEffects[i].life--;if(this.pendingEffects[i].life<=0)this.pendingEffects.splice(i,1);} }

  getActiveHitbox() {
    if(this.state!==STATE.ATTACK) return null;
    const attack=this.charDef.attacks[this.currentAttackId];
    const f=this.attackFrame;
    if(f<attack.startup||f>=attack.startup+attack.active) return null;
    const {xOff,yOff,w,h}=attack.hitbox;
    const x=this.facingRight?this.x+xOff:this.x+this.w-xOff-w;
    return {x,y:this.y+yOff,w,h};
  }
  getHurtbox() { return this.invincible?null:{x:this.x,y:this.y,w:this.w,h:this.h}; }

  takeDamage(attackData, attackerFacingRight, chargeFrames, chargeMax) {
    const cm = chargeMax>0?1+(Math.min(chargeFrames,chargeMax)/chargeMax)*0.5:1;
    const ed = attackData.damage*cm;
    this.percentage += ed;
    const kb = Physics.calcKnockback(ed,this.percentage,attackData.knockback.power,attackData.knockback.angle);
    const ws = 100/this.charDef.weight;
    this.vx = kb.vx*(attackerFacingRight?1:-1)*ws;
    this.vy = kb.vy*ws;
    const mag = Math.sqrt(this.vx**2+this.vy**2);
    this.hitstunFrames = Math.max(4,Math.floor(mag*0.6+4));
    this.hitStop = Math.min(8,Math.floor(mag*0.15+2));
    this.grounded = false;
    this.pendingEffects.push({x:this.x+this.w/2,y:this.y+this.h/2,r:16+ed,color:attackData.effectColor,life:18,maxLife:18});
    this._transitionTo(STATE.HITSTUN);
  }

  applyPhysics(stage) {
    Physics.applyGravity(this);
    const hasH = this.vx!==0&&[STATE.WALK,STATE.RUN,STATE.JUMP,STATE.DOUBLE_JUMP,STATE.FALL].includes(this.state);
    Physics.applyFriction(this,hasH);
    this.x+=this.vx; this.y+=this.vy;
    const wasGrounded=this.grounded; this.grounded=false;
    const {landed}=Physics.platformCollision(this,stage.platforms);
    if(landed){
      this.grounded=true;
      if(!wasGrounded){
        this.hasDoubleJump=true;
        if([STATE.FALL,STATE.JUMP,STATE.DOUBLE_JUMP,STATE.HITSTUN].includes(this.state)) this._transitionTo(STATE.IDLE);
      }
    }
  }

  die() { this.stocks--; this.state=STATE.DEAD; this.deathTimer=120; this.x=-9999; this.y=-9999; this.vx=0; this.vy=0; }
  respawn(point) { this.x=point.x-this.w/2; this.y=point.y-this.h; this.vx=0; this.vy=0; this.percentage=0; this.hasDoubleJump=true; this.invincible=true; this.respawnTimer=180; this.grounded=false; this._transitionTo(STATE.RESPAWN); }
  getRenderData() { return {x:this.x,y:this.y,w:this.w,h:this.h,facingRight:this.facingRight,state:this.state,charId:this.charId,charDef:this.charDef,percentage:this.percentage,stocks:this.stocks,shieldHP:this.shieldHP,invincible:this.invincible,respawnTimer:this.respawnTimer,activeHitbox:this.getActiveHitbox(),pendingEffects:this.pendingEffects,playerIndex:this.playerIndex,frameCount:this.frameCount}; }
}

// ═══════════════════════════════════════════════════════════════
// AI
// ═══════════════════════════════════════════════════════════════
const AI = (() => {
  let actionTimer=0, currentAction=null;
  function emptySnap(){return{left:false,right:false,up:false,down:false,jump:false,jumpJustPressed:false,attack:false,attackJustPressed:false,special:false,specialJustPressed:false,shield:false,shieldJustPressed:false,smashLeft:false,smashRight:false,smashUp:false,smashDown:false,smashHeld:false};}
  function applyAction(action,cpu,player){
    const snap=emptySnap(); const gr=player.x>cpu.x;
    switch(action){
      case 'runRight': snap.right=true; break;
      case 'runLeft':  snap.left=true;  break;
      case 'walkRight':snap.right=true; break;
      case 'walkLeft': snap.left=true;  break;
      case 'jump':     snap.jump=true;snap.jumpJustPressed=true; break;
      case 'jab':      if(gr)snap.right=true;else snap.left=true;snap.attack=true;snap.attackJustPressed=true; break;
      case 'tiltSide': if(gr)snap.right=true;else snap.left=true;snap.attack=true;snap.attackJustPressed=true; break;
      case 'smashSide':if(gr){snap.right=true;snap.smashRight=true;}else{snap.left=true;snap.smashLeft=true;}snap.attack=true;snap.attackJustPressed=true; break;
      case 'shield':   snap.shield=true;snap.shieldJustPressed=true; break;
      case 'dodgeLeft':snap.shield=true;snap.left=true;snap.shieldJustPressed=true; break;
      case 'dodgeRight':snap.shield=true;snap.right=true;snap.shieldJustPressed=true; break;
      case 'specialUp':snap.up=true;snap.special=true;snap.specialJustPressed=true; break;
    }
    return snap;
  }
  function decide(cpu,player,stage){
    if(actionTimer>0){actionTimer--;return applyAction(currentAction,cpu,player);}
    const dist=player.x-cpu.x, absDist=Math.abs(dist), gr=dist>0;
    const mf=stage.platforms[0];
    const onStage=cpu.x+cpu.w>mf.x&&cpu.x<mf.x+mf.w;
    if(!cpu.grounded&&!onStage){
      if(cpu.hasDoubleJump){currentAction='jump';actionTimer=10;}
      else{currentAction='specialUp';actionTimer=20;}
      return applyAction(currentAction,cpu,player);
    }
    if(player.state===STATE.HITSTUN&&absDist<150){currentAction='smashSide';actionTimer=25;return applyAction(currentAction,cpu,player);}
    const hb=player.getActiveHitbox&&player.getActiveHitbox();
    if(hb&&absDist<160){
      if(Math.random()<0.55){currentAction='shield';actionTimer=18;}
      else{currentAction=gr?'dodgeLeft':'dodgeRight';actionTimer=24;}
      return applyAction(currentAction,cpu,player);
    }
    if(absDist>250){currentAction=gr?'runRight':'runLeft';actionTimer=12;}
    else if(absDist>100){
      currentAction=gr?'walkRight':'walkLeft';actionTimer=8;
      if(Math.random()<0.03){currentAction='jab';actionTimer=20;}
    } else {
      const r=Math.random();
      if(r<0.25){currentAction='smashSide';actionTimer=30;}
      else if(r<0.45){currentAction=gr?'dodgeLeft':'dodgeRight';actionTimer=24;}
      else if(r<0.65){currentAction='jump';actionTimer=6;}
      else if(r<0.80){currentAction='tiltSide';actionTimer=20;}
      else{currentAction='jab';actionTimer=15;}
    }
    return applyAction(currentAction,cpu,player);
  }
  return{decide};
})();

// INPUT
// ═══════════════════════════════════════════════════════════════
const VPAD = {
  dpadCX:160,dpadCY:570,dpadArmW:70,dpadArmH:55,
  jump:   {x:1060,y:460,r:44,label:'J'},
  attack: {x:1160,y:520,r:44,label:'A'},
  special:{x:1060,y:580,r:38,label:'S'},
  shield: {x:1160,y:460,r:38,label:'D'},
};

class InputManager {
  constructor(canvasEl){
    this.canvas=canvasEl;this.scaleX=1;this.scaleY=1;this.offsetX=0;this.offsetY=0;
    this._raw=this._emptyRaw();this._prev=this._emptyRaw();
    this._dirPressFrame={left:-999,right:-999,up:-999,down:-999};
    this._attackPressFrame=-999;this._frameCount=0;
    this._prevRight=false;this._prevLeft=false;
    this._bindKeyboard();this._bindTouch();
  }
  updateScale(sx,sy,ox,oy){this.scaleX=sx;this.scaleY=sy;this.offsetX=ox||0;this.offsetY=oy||0;}
  pollFrame(){this._frameCount++;this._prev=Object.assign({},this._raw);}
  getSnapshot(pi){
    if(pi!==0)return this._emptySnap();
    const r=this._raw,p=this._prev,f=this._frameCount,SW=4;
    const jumpJP=r.jump&&!p.jump,attackJP=r.attack&&!p.attack,specialJP=r.special&&!p.special,shieldJP=r.shield&&!p.shield;
    if(r.left&&!p.left)this._dirPressFrame.left=f;
    if(r.right&&!p.right)this._dirPressFrame.right=f;
    if(r.up&&!p.up)this._dirPressFrame.up=f;
    if(r.down&&!p.down)this._dirPressFrame.down=f;
    if(attackJP)this._attackPressFrame=f;
    const smashRight=r.right&&(f-this._dirPressFrame.right<=SW)&&attackJP;
    const smashLeft =r.left &&(f-this._dirPressFrame.left <=SW)&&attackJP;
    const smashUp   =r.up   &&(f-this._dirPressFrame.up   <=SW)&&attackJP;
    const smashDown =r.down &&(f-this._dirPressFrame.down <=SW)&&attackJP;
    return{left:r.left,right:r.right,up:r.up,down:r.down,jump:r.jump,jumpJustPressed:jumpJP,attack:r.attack,attackJustPressed:attackJP,special:r.special,specialJustPressed:specialJP,shield:r.shield,shieldJustPressed:shieldJP,smashLeft,smashRight,smashUp,smashDown,smashHeld:r.attack&&!attackJP};
  }
  getVirtualGamepadRenderData(){return{vpad:VPAD,raw:Object.assign({},this._raw)};}
  _bindKeyboard(){
    const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',z:'jump',Z:'jump',x:'attack',X:'attack',c:'special',C:'special',v:'shield',V:'shield'};
    window.addEventListener('keydown',e=>{if(map[e.key]!==undefined){this._raw[map[e.key]]=true;e.preventDefault();}});
    window.addEventListener('keyup',e=>{if(map[e.key]!==undefined)this._raw[map[e.key]]=false;});
  }
  _bindTouch(){
    const el=this.canvas;
    const onTouch=e=>{
      e.preventDefault();
      const ns={left:false,right:false,up:false,down:false,jump:false,attack:false,special:false,shield:false};
      for(const t of e.touches){
        const lx=(t.clientX-this.offsetX)/this.scaleX;
        const ly=(t.clientY-this.offsetY)/this.scaleY;
        this._classifyTouch(lx,ly,ns);
      }
      this._raw.left=ns.left;this._raw.right=ns.right;this._raw.up=ns.up;this._raw.down=ns.down;
      this._raw.jump=ns.jump;this._raw.attack=ns.attack;this._raw.special=ns.special;this._raw.shield=ns.shield;
    };
    el.addEventListener('touchstart',onTouch,{passive:false});
    el.addEventListener('touchmove',onTouch,{passive:false});
    el.addEventListener('touchend',onTouch,{passive:false});
    el.addEventListener('touchcancel',onTouch,{passive:false});
  }
  _classifyTouch(lx,ly,state){
    const v=VPAD;
    if(lx<640){
      const dx=lx-v.dpadCX,dy=ly-v.dpadCY,dead=28;
      if(Math.abs(dx)>dead)state[dx>0?'right':'left']=true;
      if(Math.abs(dy)>dead)state[dy>0?'down':'up']=true;
      return;
    }
    for(const[key,btn]of Object.entries({jump:v.jump,attack:v.attack,special:v.special,shield:v.shield})){
      if(Math.sqrt((lx-btn.x)**2+(ly-btn.y)**2)<=btn.r+16)state[key]=true;
    }
  }
  _emptyRaw(){return{left:false,right:false,up:false,down:false,jump:false,attack:false,special:false,shield:false};}
  _emptySnap(){return{left:false,right:false,up:false,down:false,jump:false,jumpJustPressed:false,attack:false,attackJustPressed:false,special:false,specialJustPressed:false,shield:false,shieldJustPressed:false,smashLeft:false,smashRight:false,smashUp:false,smashDown:false,smashHeld:false};}
}

// RENDERER
// ═══════════════════════════════════════════════════════════════
const LOGICAL_W=1280,LOGICAL_H=720;

class Renderer {
  constructor(canvasEl,inputManager){
    this.canvas=canvasEl;this.ctx=canvasEl.getContext('2d');this.inputManager=inputManager;this.resize();
  }
  resize(){
    const sw=window.innerWidth,sh=window.innerHeight;
    const scale=Math.min(sw/LOGICAL_W,sh/LOGICAL_H);
    const cssW=Math.floor(LOGICAL_W*scale),cssH=Math.floor(LOGICAL_H*scale);
    const offX=Math.floor((sw-cssW)/2),offY=Math.floor((sh-cssH)/2);
    this.canvas.width=LOGICAL_W;this.canvas.height=LOGICAL_H;
    this.canvas.style.width=cssW+'px';this.canvas.style.height=cssH+'px';
    this.canvas.style.left=offX+'px';this.canvas.style.top=offY+'px';
    this.inputManager.updateScale(scale,scale,offX,offY);
  }
  draw(gs,fighters,stage){
    const ctx=this.ctx;ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
    switch(gs.screen){
      case 'TITLE':       this._drawTitle(gs); break;
      case 'CHAR_SELECT': this._drawCharSelect(gs); break;
      case 'BATTLE':      this._drawBattle(fighters,stage); break;
      case 'RESULTS':     this._drawResults(gs,fighters); break;
    }
  }
  _drawTitle(gs){
    this._gradBg('#0a0a1a','#1a0a2e');
    const ctx=this.ctx;ctx.save();ctx.textAlign='center';
    ctx.fillStyle='#ffffff';ctx.font='bold 96px sans-serif';ctx.fillText('SmashJS',LOGICAL_W/2,280);
    ctx.font='bold 28px sans-serif';ctx.fillStyle='#aaaaff';ctx.fillText('Xperia 横画面専用',LOGICAL_W/2,340);
    if(Math.floor(Date.now()/500)%2===0){ctx.fillStyle='#ffffff';ctx.font='36px sans-serif';ctx.fillText('タップしてスタート',LOGICAL_W/2,460);}
    ctx.restore();
  }
  _drawCharSelect(gs){
    this._gradBg('#0d1117','#161b22');
    const ctx=this.ctx;ctx.save();ctx.textAlign='center';
    ctx.fillStyle='#ffffff';ctx.font='bold 48px sans-serif';ctx.fillText('キャラ選択',LOGICAL_W/2,80);
    ctx.font='24px sans-serif';ctx.fillStyle='#888888';ctx.fillText('← → で選択  |  Aボタン(攻撃)で決定',LOGICAL_W/2,120);
    const bw=240,bh=300,total=CHAR_KEYS.length*(bw+40)-40,sx=(LOGICAL_W-total)/2;
    CHAR_KEYS.forEach((key,i)=>{
      const cd=CHARACTERS[key],bx=sx+i*(bw+40),by=170,sel=gs.p1CharIndex===i;
      ctx.fillStyle=sel?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.05)';
      this._rr(ctx,bx,by,bw,bh,16,true,false);
      if(sel){ctx.strokeStyle=cd.colorBody;ctx.lineWidth=3;this._rr(ctx,bx,by,bw,bh,16,false,true);}
      this._drawChar(ctx,cd,bx+bw/2-cd.bodyW/2,by+40,true);
      ctx.fillStyle='#ffffff';ctx.font='bold 22px sans-serif';ctx.fillText(cd.name,bx+bw/2,by+bh-80);
      ctx.fillStyle='#aaaaaa';ctx.font='16px sans-serif';
      ctx.fillText(`重${cd.weight} 速${cd.runSpeed}`,bx+bw/2,by+bh-55);
    });
    ctx.restore();
  }
  _drawBattle(fighters,stage){
    this._gradBg(stage.bgColor,stage.bgAccent);
    this._drawStage(stage);
    for(const f of fighters){const rd=f.getRenderData();this._drawFighter(rd);for(const e of rd.pendingEffects)this._drawEffect(e);}
    this._drawHUD(fighters);
    this._drawVPad();
  }
  _drawStage(stage){
    const ctx=this.ctx;
    for(const p of stage.platforms){
      ctx.fillStyle=p.color;this._rr(ctx,p.x,p.y,p.w,p.h,6,true,false);
      ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(p.x+4,p.y+2,p.w-8,4);
    }
  }
  _drawFighter(rd){
    if(rd.state===STATE.DEAD)return;
    const ctx=this.ctx;ctx.save();
    if(rd.invincible&&rd.respawnTimer>0)ctx.globalAlpha=Math.floor(rd.frameCount/4)%2===0?0.35:1.0;
    this._drawChar(ctx,rd.charDef,rd.x,rd.y,rd.facingRight);
    if(rd.state===STATE.SHIELD){
      const r=50*(rd.shieldHP/100),cx=rd.x+rd.w/2,cy=rd.y+rd.h/2;
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle='rgba(100,180,255,0.35)';ctx.fill();
      ctx.strokeStyle='rgba(180,220,255,0.85)';ctx.lineWidth=3;ctx.stroke();
    }
    if(rd.activeHitbox){
      const h=rd.activeHitbox;
      ctx.strokeStyle='rgba(255,50,50,0.75)';ctx.lineWidth=2;ctx.strokeRect(h.x,h.y,h.w,h.h);
      ctx.fillStyle='rgba(255,50,50,0.18)';ctx.fillRect(h.x,h.y,h.w,h.h);
    }
    ctx.restore();
  }
  _drawChar(ctx,cd,x,y,facingRight){
    ctx.save();
    const cx=x+cd.bodyW/2;
    if(!facingRight){ctx.translate(cx*2,0);ctx.scale(-1,1);}
    ctx.fillStyle=cd.colorBody;this._rr(ctx,x,y+cd.bodyH*0.28,cd.bodyW,cd.bodyH*0.72,8,true,false);
    const hr=cd.bodyW*0.38,hcx=x+cd.bodyW/2,hcy=y+cd.bodyH*0.22;
    ctx.fillStyle=cd.colorHead;ctx.beginPath();ctx.arc(hcx,hcy,hr,0,Math.PI*2);ctx.fill();
    const eo=hr*0.35;
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(hcx+eo,hcy-hr*0.1,hr*0.22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111111';ctx.beginPath();ctx.arc(hcx+eo+2,hcy-hr*0.1,hr*0.11,0,Math.PI*2);ctx.fill();
    const fr=cd.bodyW*0.18,fx=x+cd.bodyW+fr*0.5,fy=y+cd.bodyH*0.55;
    ctx.fillStyle=cd.colorDetail;ctx.beginPath();ctx.arc(fx,fy,fr,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=cd.colorDetail;
    ctx.fillRect(x+4,y+cd.bodyH-12,cd.bodyW*0.35,12);
    ctx.fillRect(x+cd.bodyW*0.55,y+cd.bodyH-12,cd.bodyW*0.35,12);
    ctx.restore();
  }
  _drawEffect(eff){
    const ctx=this.ctx,prog=eff.life/eff.maxLife,r=eff.r*prog;
    ctx.save();ctx.globalAlpha=prog*0.85;ctx.fillStyle=eff.color;
    ctx.beginPath();ctx.arc(eff.x,eff.y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=eff.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(eff.x,eff.y,r*1.4,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  _drawHUD(fighters){
    const ctx=this.ctx;
    fighters.forEach((f,i)=>{
      const rd=f.getRenderData(),isL=i===0,bx=isL?20:LOGICAL_W-250,by=LOGICAL_H-120,w=230,h=110;
      ctx.fillStyle='rgba(0,0,0,0.55)';this._rr(ctx,bx,by,w,h,10,true,false);
      ctx.strokeStyle=rd.charDef.colorBody;ctx.lineWidth=2;this._rr(ctx,bx,by,w,h,10,false,true);
      ctx.fillStyle=rd.charDef.colorBody;ctx.font='bold 16px sans-serif';
      ctx.textAlign=isL?'left':'right';ctx.fillText(rd.charDef.name+(i===0?' P1':' CPU'),isL?bx+10:bx+w-10,by+22);
      ctx.fillStyle=rd.percentage>=100?'#ff4444':'#ffffff';ctx.font=`bold ${rd.percentage>=100?52:58}px sans-serif`;
      ctx.textAlign='center';ctx.fillText(Math.floor(rd.percentage)+'%',bx+w/2,by+76);
      const ss=22,tw=rd.stocks*ss-4,sx=bx+(w-tw)/2;
      for(let s=0;s<rd.stocks;s++){ctx.fillStyle=rd.charDef.colorBody;ctx.beginPath();ctx.arc(sx+s*ss+7,by+98,7,0,Math.PI*2);ctx.fill();}
    });
  }
  _drawVPad(){
    const ctx=this.ctx,data=this.inputManager.getVirtualGamepadRenderData(),vp=data.vpad,raw=data.raw;
    ctx.save();ctx.globalAlpha=0.45;
    const dCX=vp.dpadCX,dCY=vp.dpadCY,aw=vp.dpadArmW,ah=vp.dpadArmH;
    const parts=[{k:'left',rx:dCX-aw-8,ry:dCY-ah/2,rw:aw,rh:ah},{k:'right',rx:dCX+8,ry:dCY-ah/2,rw:aw,rh:ah},{k:'up',rx:dCX-ah/2,ry:dCY-aw-8,rw:ah,rh:aw},{k:'down',rx:dCX-ah/2,ry:dCY+8,rw:ah,rh:aw}];
    for(const p of parts){ctx.fillStyle=raw[p.k]?'#ffffff':'#666666';this._rr(ctx,p.rx,p.ry,p.rw,p.rh,6,true,false);}
    ctx.fillStyle='#444444';this._rr(ctx,dCX-ah/2,dCY-ah/2,ah,ah,6,true,false);
    const btns=[{cfg:vp.jump,k:'jump',c:'#44cc44'},{cfg:vp.attack,k:'attack',c:'#cc4444'},{cfg:vp.special,k:'special',c:'#4444cc'},{cfg:vp.shield,k:'shield',c:'#cccc44'}];
    for(const b of btns){
      ctx.fillStyle=raw[b.k]?b.c:'#555555';ctx.beginPath();ctx.arc(b.cfg.x,b.cfg.y,b.cfg.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffffff';ctx.font=`bold ${b.cfg.r*0.7}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.cfg.label,b.cfg.x,b.cfg.y);
    }
    ctx.textBaseline='alphabetic';ctx.restore();
  }
  _drawResults(gs,fighters){
    this._gradBg('#0a0a0a','#1a1a1a');
    const ctx=this.ctx;ctx.save();ctx.textAlign='center';
    if(gs.winner){
      const cd=gs.winner.charDef;
      ctx.fillStyle=cd.colorBody;ctx.font='bold 72px sans-serif';ctx.fillText(cd.name+' の勝利！',LOGICAL_W/2,260);
      this._drawChar(ctx,cd,LOGICAL_W/2-cd.bodyW/2,300,true);
    }
    if(gs.resultTimer>120&&Math.floor(Date.now()/600)%2===0){
      ctx.fillStyle='#ffffff';ctx.font='32px sans-serif';ctx.fillText('タップでリマッチ',LOGICAL_W/2,LOGICAL_H-60);
    }
    ctx.restore();
  }
  _gradBg(top,bot){
    const g=this.ctx.createLinearGradient(0,0,0,LOGICAL_H);g.addColorStop(0,top);g.addColorStop(1,bot);
    this.ctx.fillStyle=g;this.ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
  }
  _rr(ctx,x,y,w,h,r,fill,stroke){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    if(fill)ctx.fill();if(stroke)ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════════
// MAIN
// ═══════════════════════════════════════════════════════════════
const gameState={screen:'TITLE',p1CharIndex:0,stageId:'battlefield',winner:null,resultTimer:0,frameCount:0};
const canvas=document.getElementById('gameCanvas');
const inputManager=new InputManager(canvas);
const renderer=new Renderer(canvas,inputManager);
let fighters=[],stage=null;

const STEP_MS=1000/60;let accumulator=0,lastTime=0;

function loop(ts){
  const delta=Math.min(ts-lastTime,100);lastTime=ts;accumulator+=delta;
  while(accumulator>=STEP_MS){update();accumulator-=STEP_MS;}
  renderer.draw(gameState,fighters,stage);
  requestAnimationFrame(loop);
}

function update(){
  gameState.frameCount++;inputManager.pollFrame();
  switch(gameState.screen){
    case 'TITLE':       updateTitle();      break;
    case 'CHAR_SELECT': updateCharSelect(); break;
    case 'BATTLE':      updateBattle();     break;
    case 'RESULTS':     updateResults();    break;
  }
}

function updateTitle(){
  const snap=inputManager.getSnapshot(0);
  if(snap.attackJustPressed||snap.jumpJustPressed||snap.specialJustPressed)gameState.screen='CHAR_SELECT';
}

function updateCharSelect(){
  const snap=inputManager.getSnapshot(0),n=CHAR_KEYS.length;
  if(snap.smashRight||(snap.right&&!inputManager._prevRight))gameState.p1CharIndex=(gameState.p1CharIndex+1)%n;
  if(snap.smashLeft||(snap.left&&!inputManager._prevLeft))gameState.p1CharIndex=(gameState.p1CharIndex-1+n)%n;
  inputManager._prevRight=snap.right;inputManager._prevLeft=snap.left;
  if(snap.attackJustPressed||snap.jumpJustPressed)startBattle();
}

function startBattle(){
  const p1Key=CHAR_KEYS[gameState.p1CharIndex],cpuKey=CHAR_KEYS[Math.floor(Math.random()*CHAR_KEYS.length)];
  stage=getStage(gameState.stageId);
  fighters=[
    new Fighter(p1Key,0,stage.spawnPoints[0].x-CHARACTERS[p1Key].bodyW/2,stage.spawnPoints[0].y-CHARACTERS[p1Key].bodyH),
    new Fighter(cpuKey,1,stage.spawnPoints[1].x-CHARACTERS[cpuKey].bodyW/2,stage.spawnPoints[1].y-CHARACTERS[cpuKey].bodyH),
  ];
  gameState.screen='BATTLE';gameState.winner=null;
}

function updateBattle(){
  const p1Snap=inputManager.getSnapshot(0);
  const cpuSnap=AI.decide(fighters[1],fighters[0],stage);
  const snaps=[p1Snap,cpuSnap];
  for(let i=0;i<2;i++){
    const f=fighters[i],sn=snaps[i];
    if((f.state===STATE.JUMP||f.state===STATE.DOUBLE_JUMP)&&f.vy<0&&!sn.jump&&gameState.frameCount-f.jumpPressedFrame<=6&&gameState.frameCount-f.jumpPressedFrame>0)
      f.vy=Math.max(f.vy,f.charDef.shortHopPower);
  }
  for(let i=0;i<2;i++)fighters[i].update(snaps[i],fighters[1-i],stage);
  checkHits(fighters[0],fighters[1]);checkHits(fighters[1],fighters[0]);
  for(const f of fighters){
    if(f.state!==STATE.DEAD&&f.state!==STATE.RESPAWN)f.applyPhysics(stage);
    if(f.state!==STATE.DEAD&&f.state!==STATE.RESPAWN&&Physics.blastZoneCheck(f,stage.blastZones))f.die();
  }
  for(let i=0;i<2;i++){const f=fighters[i];if(f.state===STATE.DEAD&&f.deathTimer<=0&&f.stocks>0)f.respawn(stage.spawnPoints[i]);}
  if(fighters.some(f=>f.stocks<=0)){gameState.winner=fighters.find(f=>f.stocks>0)||null;gameState.resultTimer=0;gameState.screen='RESULTS';}
}

function checkHits(attacker,defender){
  if(attacker.state!==STATE.ATTACK)return;
  const hb=attacker.getActiveHitbox();if(!hb)return;
  if(attacker.hitEntities.has(defender))return;
  const hurt=defender.getHurtbox();if(!hurt)return;
  if(Physics.rectOverlap(hb,hurt)){
    attacker.hitEntities.add(defender);
    const attack=attacker.charDef.attacks[attacker.currentAttackId];
    if(defender.state===STATE.SHIELD){
      defender.shieldHP-=attack.damage*0.8;attacker.vx=attacker.facingRight?-3:3;
    } else {
      defender.takeDamage(attack,attacker.facingRight,attacker.chargeFrames,attack.chargeMax);
      attacker.hitStop=Math.min(8,Math.floor(attack.damage*0.3+2));
    }
  }
}

function updateResults(){
  gameState.resultTimer++;
  if(gameState.resultTimer>120){const snap=inputManager.getSnapshot(0);if(snap.attackJustPressed||snap.jumpJustPressed||snap.specialJustPressed)startBattle();}
  if(gameState.resultTimer>600)gameState.screen='TITLE';
}

// touchend on document so it works regardless of canvas offset
document.addEventListener('touchend',()=>{
  if(gameState.screen==='TITLE')gameState.screen='CHAR_SELECT';
  else if(gameState.screen==='RESULTS'&&gameState.resultTimer>120)startBattle();
},{passive:true});
// fallback for desktop
document.addEventListener('click',()=>{
  if(gameState.screen==='TITLE')gameState.screen='CHAR_SELECT';
  else if(gameState.screen==='RESULTS'&&gameState.resultTimer>120)startBattle();
});

window.addEventListener('resize',()=>renderer.resize());
window.addEventListener('orientationchange',()=>setTimeout(()=>renderer.resize(),100));

stage=getStage('battlefield');
requestAnimationFrame(loop);
</script>
</body>
</html>
